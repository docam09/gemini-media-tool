[tool.poetry]
name = "vn-kr-translator-backend"
version = "0.1.0"
description = "FastAPI backend for the Vietnamese <-> Korean realtime translator (Gemini-powered)."
authors = ["docam09 <dohuucam500@gmail.com>"]
readme = "../README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = { extras = ["standard"], version = "^0.115.0" }
google-genai = "^0.8.0"
pydantic = "^2.9.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
