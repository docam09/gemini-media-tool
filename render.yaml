# Render Blueprint — single web service running the whole app.
# Deploy: push this repo to GitHub, then in Render choose
# "New > Blueprint" and connect the repo. Render reads this file.
services:
  - type: web
    name: gemini-media-tool
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SONIOX_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
